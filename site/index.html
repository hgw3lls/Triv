<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Robbie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="pill count" id="backBtn" type="button" aria-label="Clear all answers (tap twice)"><span aria-hidden="true">&lsaquo;</span><span id="count">0</span></button>
  <div class="who">
    <button class="avatar" id="hideBtn" type="button" aria-label="Hide or show the thread">A</button>
    <button class="pill name" id="settingsBtn" type="button" aria-label="Open settings">Robbie <span aria-hidden="true">&rsaquo;</span></button>
    <div class="status" id="status"></div>
  </div>
  <button class="round glass" id="saveBtn" type="button" aria-label="Save answers to a file">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V4a1 1 0 0 1 1-1ZM5 19a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2H5Z"/></svg>
  </button>
</header>

<main class="thread" id="thread" aria-live="polite"></main>

<p class="notice" id="notice" role="status"></p>

<input type="file" id="fileInput" accept="image/*" hidden>
<form class="composer" id="composer">
  <button class="round glass" id="plusBtn" type="button" aria-label="Attach a photo of a question">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1Z"/></svg>
  </button>
  <div class="field">
    <input type="text" id="askInput" autocomplete="off" enterkeyhint="send" placeholder="Message" aria-label="Type a question">
    <button class="inline mic" id="micBtn" type="button" aria-pressed="false" aria-label="Start listening">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9Z"/></svg>
    </button>
    <button class="inline send" id="sendBtn" type="submit" aria-label="Send question" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5a1 1 0 0 1 .7.3l6 6a1 1 0 1 1-1.4 1.4L13 7.9V19a1 1 0 1 1-2 0V7.9l-4.3 4.3a1 1 0 0 1-1.4-1.4l6-6a1 1 0 0 1 .7-.3Z"/></svg>
    </button>
  </div>
</form>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form method="dialog" class="sheet" id="sheetForm">
    <div class="sheethead">
      <h2 id="sheetTitle">Settings</h2>
      <button class="textbtn strong" type="submit" id="doneBtn">Done</button>
    </div>

    <p class="hint" id="sheetHint">Add at least one API key. Gemini, Groq and OpenRouter have free keys. Keys stay in this browser and are sent only to the company that issued them.</p>

    <fieldset>
      <legend>Claude</legend>
      <label for="key-claude">API key</label>
      <input id="key-claude" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
      <label for="model-claude">Model</label>
      <input id="model-claude" type="text" autocomplete="off" spellcheck="false" list="list-claude">
      <datalist id="list-claude"></datalist>
    </fieldset>

    <fieldset>
      <legend>OpenAI</legend>
      <label for="key-openai">API key</label>
      <input id="key-openai" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
      <label for="model-openai">Model</label>
      <input id="model-openai" type="text" autocomplete="off" spellcheck="false" list="list-openai">
      <datalist id="list-openai"></datalist>
    </fieldset>

    <fieldset>
      <legend>Gemini</legend>
      <label for="key-gemini">API key</label>
      <input id="key-gemini" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
      <label for="model-gemini">Model</label>
      <input id="model-gemini" type="text" autocomplete="off" spellcheck="false" list="list-gemini">
      <datalist id="list-gemini"></datalist>
    </fieldset>

    <fieldset>
      <legend>Groq (free)</legend>
      <label for="key-groq">API key</label>
      <input id="key-groq" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…">
      <label for="model-groq">Model</label>
      <input id="model-groq" type="text" autocomplete="off" spellcheck="false" list="list-groq">
      <datalist id="list-groq"></datalist>
    </fieldset>

    <fieldset>
      <legend>OpenRouter (free models)</legend>
      <label for="key-openrouter">API key</label>
      <input id="key-openrouter" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-…">
      <label for="model-openrouter">Model</label>
      <input id="model-openrouter" type="text" autocomplete="off" spellcheck="false" list="list-openrouter">
      <datalist id="list-openrouter"></datalist>
    </fieldset>

    <button class="rowbtn" type="button" id="modelsBtn">Check keys and load model lists</button>
    <p class="hint" id="modelsOut"></p>

    <fieldset>
      <legend>Behavior</legend>
      <label class="check"><input type="checkbox" id="optSearch"> Let models search the web when unsure</label>
      <label class="check"><input type="checkbox" id="optAuto"> Answer questions automatically (off: double-tap a question to look it up)</label>
      <label class="check"><input type="checkbox" id="optRemember"> Remember keys on this device</label>
      <label for="optLang">Listening language</label>
      <input id="optLang" type="text" autocomplete="off" spellcheck="false" placeholder="en-US">
    </fieldset>

    <fieldset>
      <legend>Answers</legend>
      <button class="rowbtn" type="button" id="saveMd">Save answers as a text file (.md)</button>
      <button class="rowbtn" type="button" id="saveCsv">Save answers as a spreadsheet (.csv)</button>
      <button class="rowbtn danger" type="button" id="clearBtn">Clear all answers</button>
    </fieldset>
  </form>
</dialog>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
